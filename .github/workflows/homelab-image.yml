name: Homelab image

# Builds this branch the same way upstream builds danonline/autopulse:latest
# (amd64, musl, --features vendored, the repo Dockerfile) and pushes it to
# ghcr.io/<owner>/autopulse:<branch>-<short sha>. Runs until upstream releases the fix.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/emby-replace-all-options

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --locked --release --features vendored --target x86_64-unknown-linux-musl --workspace

      - name: Build binary
        run: |
          cargo build --locked --release --features vendored --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/autopulse ./autopulse
          file ./autopulse

      - name: Tag
        id: tag
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-')-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          context: .
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/autopulse:${{ steps.tag.outputs.tag }}

      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/autopulse:${{ steps.tag.outputs.tag }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
